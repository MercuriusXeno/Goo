plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.gradle.userdev' version '7.1.21'
    id 'jacoco'
    id 'checkstyle'
    id 'com.github.spotbugs' version '6.1.7'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(25)

// Apply access transformers at compile time so AT-widened members are visible to javac
minecraft.accessTransformers.file rootProject.file('src/main/resources/META-INF/accesstransformer.cfg')

runs {
    configureEach {
        systemProperty 'forge.logging.markers', 'REGISTRIES'
        systemProperty 'forge.logging.console.level', 'debug'
        modSource project.sourceSets.main
    }
    client {
        systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        systemProperty 'devauth.enabled', 'true'
    }
    server {
        systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        // GUI enabled so the server window can be closed cleanly
    }
    clientData {
        arguments.addAll '--mod', project.mod_id, '--all',
            '--output', file('src/generated/resources/').absolutePath,
            '--existing', file('src/main/resources/').absolutePath
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

repositories {
    maven { url = 'https://pkgs.dev.azure.com/djtheredstoner/DevAuth/_packaging/public/maven/v1' }
}

dependencies {
    implementation "net.neoforged:neoforge:${neo_version}"
    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testImplementation 'org.mockito:mockito-core:5.23.0'
    testImplementation 'org.mockito:mockito-junit-jupiter:5.23.0'
    testImplementation 'org.instancio:instancio-junit:5.4.0'
    testImplementation 'com.tngtech.archunit:archunit-junit5:1.4.1'
    localRuntime 'me.djtheredstoner:DevAuth-neoforge:1.2.2'
}

tasks.named('test', Test) {
    useJUnitPlatform()
}

tasks.register('gooTest', Test) {
    description = 'Runs Goo unit tests (JUnit 5, no Minecraft server required)'
    group = 'verification'
    useJUnitPlatform()
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    outputs.upToDateWhen { false }
    testLogging {
        if (project.hasProperty('verbose')) {
            events 'passed', 'failed', 'skipped'
        } else {
            events 'failed'
        }
        showStandardStreams = false
        exceptionFormat = 'short'
    }
}

tasks.register('jacocoGooTestReport', JacocoReport) {
    description = 'Generates JaCoCo coverage report for gooTest'
    group = 'verification'
    dependsOn tasks.named('gooTest')
    executionData fileTree(dir: layout.buildDirectory, includes: ['jacoco/*.exec'])
    sourceSets sourceSets.main
    reports {
        html.required = true
        xml.required = false
        csv.required = true
    }
    // No exclusions. Every 0% class is a MOCK_BLOCK extraction waiting to happen.
}

checkstyle {
    toolVersion = '10.21.4'
    configFile = file('config/checkstyle/checkstyle.xml')
    // Warnings, not build failures - smells are heuristics
    maxWarnings = Integer.MAX_VALUE
    maxErrors = 0
    ignoreFailures = true
}

// Only lint main sources, skip generated and test
tasks.named('checkstyleTest') { enabled = false }

// CPD: copy-paste detection across main sources
configurations { cpd }
dependencies {
    cpd 'net.sourceforge.pmd:pmd-java:7.9.0'
    cpd 'net.sourceforge.pmd:pmd-cli:7.9.0'
}

tasks.register('cpd', JavaExec) {
    description = 'Finds duplicated code fragments via PMD CPD'
    group = 'verification'
    mainClass = 'net.sourceforge.pmd.cli.PmdCli'
    classpath = configurations.cpd
    args = [
        'cpd',
        '--minimum-tokens', '50',
        '--language', 'java',
        '--dir', sourceSets.main.java.srcDirs.first().absolutePath,
        '--format', 'text'
    ]
    // Warnings, not build failures
    ignoreExitValue = true
}

spotbugs {
    // Warnings, not build failures
    ignoreFailures = true
    effort = 'max'
    reportLevel = 'medium'
}

// Only analyze main sources
tasks.named('spotbugsTest') { enabled = false }

tasks.withType(com.github.spotbugs.snom.SpotBugsTask).configureEach {
    reports {
        html {
            required = true
            outputLocation = file("${layout.buildDirectory.get()}/reports/spotbugs/main.html")
        }
        xml {
            required = true
            outputLocation = file("${layout.buildDirectory.get()}/reports/spotbugs/main.xml")
        }
    }
}

tasks.register('generateTextures', JavaExec) {
    description = 'Regenerates CA fluid textures and blob base sprites'
    group = 'goo'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.mercuriusxeno.goo.tools.FluidTextureGenerator'
    workingDir = project.projectDir
}

tasks.withType(ProcessResources).configureEach {
    var replaceProperties = [
        minecraft_version      : minecraft_version,
        minecraft_version_range: minecraft_version_range,
        neo_version            : neo_version,
        neo_version_range      : neo_version_range,
        loader_version_range   : loader_version_range,
        mod_id                 : mod_id,
        mod_name               : mod_name,
        mod_license            : mod_license,
        mod_version            : mod_version,
        mod_authors            : mod_authors,
        mod_description        : mod_description,
    ]
    inputs.properties replaceProperties
    filesMatching(['META-INF/neoforge.mods.toml']) {
        expand replaceProperties
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

// NeoGradle run init scripts use Task.project and Gradle.addListener at execution
// time, which are unsupported with the configuration cache in Gradle 9.
tasks.configureEach {
    if (name.contains('net.neoforged.fml.startup')) {
        notCompatibleWithConfigurationCache('NeoGradle run tasks use Task.project at execution time')
    }
}
