plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.gradle.userdev' version '7.1.21'
    id 'jacoco'
    id 'checkstyle'
    id 'pmd'
    id 'com.github.spotbugs' version '6.1.13'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(25)

// Apply access transformers at compile time so AT-widened members are visible to javac
minecraft.accessTransformers.file rootProject.file('src/main/resources/META-INF/accesstransformer.cfg')

runs {
    configureEach {
        systemProperty 'forge.logging.markers', 'REGISTRIES'
        systemProperty 'forge.logging.console.level', 'debug'
        modSource project.sourceSets.main
    }
    client {
        systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        systemProperty 'devauth.enabled', 'true'
    }
    server {
        systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        // GUI enabled so the server window can be closed cleanly
    }
    clientData {
        arguments.addAll '--mod', project.mod_id, '--all',
            '--output', file('src/generated/resources/').absolutePath,
            '--existing', file('src/main/resources/').absolutePath
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

repositories {
    maven { url = 'https://pkgs.dev.azure.com/djtheredstoner/DevAuth/_packaging/public/maven/v1' }
}

dependencies {
    implementation "net.neoforged:neoforge:${neo_version}"
    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testImplementation 'org.mockito:mockito-core:5.23.0'
    testImplementation 'org.mockito:mockito-junit-jupiter:5.23.0'
    testImplementation 'org.instancio:instancio-junit:5.4.0'
    testImplementation 'com.tngtech.archunit:archunit-junit5:1.4.1'
    localRuntime 'me.djtheredstoner:DevAuth-neoforge:1.2.2'
}

tasks.named('test', Test) {
    useJUnitPlatform()
    testLogging {
        events 'failed'
        showStandardStreams = false
        exceptionFormat = 'full'
        showCauses = true
        showStackTraces = true
    }
    reports {
        html.required = true
        junitXml {
            required = true
            // Capture stdout/stderr per-test in the XML files
            outputPerTestCase = true
        }
    }
}

tasks.register('gooTest', Test) {
    description = 'Runs Goo unit tests (JUnit 5, no Minecraft server required)'
    group = 'verification'
    useJUnitPlatform()
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    outputs.upToDateWhen { false }
    testLogging {
        if (project.hasProperty('verbose')) {
            events 'passed', 'failed', 'skipped'
        } else {
            events 'failed'
        }
        showStandardStreams = false
        exceptionFormat = 'short'
    }
}

tasks.register('jacocoGooTestReport', JacocoReport) {
    description = 'Generates JaCoCo coverage report for gooTest'
    group = 'verification'
    dependsOn tasks.named('gooTest')
    executionData fileTree(dir: layout.buildDirectory, includes: ['jacoco/*.exec'])
    sourceSets sourceSets.main
    reports {
        html.required = true
        xml.required = false
        csv.required = true
    }
    // No exclusions. Every 0% class is a MOCK_BLOCK extraction waiting to happen.
}

checkstyle {
    toolVersion = '10.21.4'
    configFile = file('config/checkstyle/checkstyle.xml')
    // All violations pass through to the digest; build does not fail on checkstyle alone
    ignoreFailures = true
}

// Only lint main sources, skip generated and test
tasks.named('checkstyleTest') { enabled = false }

pmd {
    // Upgraded from 7.9.0 for ASM 9.9 (JDK 25 / class file version 69)
    toolVersion = '7.21.0'
    // Custom ruleset curated for Goo; avoids overlap with Checkstyle and SpotBugs
    ruleSets = []
    ruleSetFiles = files('config/pmd/pmd-ruleset.xml')
    // Warnings, not build failures - smells are heuristics
    ignoreFailures = true
    consoleOutput = false
}

// Only lint main sources
tasks.named('pmdTest') { enabled = false }

// CPD: copy-paste detection across main sources
configurations { cpd }
dependencies {
    cpd 'net.sourceforge.pmd:pmd-java:7.21.0'
    cpd 'net.sourceforge.pmd:pmd-cli:7.21.0'
}

tasks.register('cpd', JavaExec) {
    description = 'Finds duplicated code fragments via PMD CPD'
    group = 'verification'
    mainClass = 'net.sourceforge.pmd.cli.PmdCli'
    classpath = configurations.cpd
    var cpdReport = layout.buildDirectory.file('reports/cpd/main.xml')
    args = [
        'cpd',
        '--minimum-tokens', '50',
        '--language', 'java',
        '--dir', sourceSets.main.java.srcDirs.first().absolutePath,
        '--format', 'xml'
    ]
    // Warnings, not build failures
    ignoreExitValue = true
    // Redirect stdout to report file (config-cache safe)
    standardOutput = System.out
    doFirst {
        cpdReport.get().asFile.parentFile.mkdirs()
        standardOutput = new FileOutputStream(cpdReport.get().asFile)
    }
}

// Wire CPD into the check lifecycle
tasks.named('check') { dependsOn 'cpd' }

spotbugs {
    // Warnings, not build failures
    ignoreFailures = true
    effort = com.github.spotbugs.snom.Effort.valueOf('MAX')
    reportLevel = com.github.spotbugs.snom.Confidence.valueOf('MEDIUM')
    excludeFilter = file('config/spotbugs/spotbugs-exclude.xml')
    // Override engine to 4.9.8 for ASM 9.9 (JDK 25 / class file version 69)
    toolVersion = '4.9.8'
}

dependencies {
    spotbugsPlugins 'com.mebigfatguy.sb-contrib:sb-contrib:7.6.8'
    spotbugsPlugins 'com.h3xstream.findsecbugs:findsecbugs-plugin:1.13.0'
}

// Only analyze main sources
tasks.named('spotbugsTest') { enabled = false }

tasks.withType(com.github.spotbugs.snom.SpotBugsTask).configureEach {
    showProgress = false
    // Suppress "classes needed for analysis were missing" stderr noise
    extraArgs = ['-quiet']
    reports {
        html {
            required = true
            outputLocation = file("${layout.buildDirectory.get()}/reports/spotbugs/main.html")
        }
        xml {
            required = true
            outputLocation = file("${layout.buildDirectory.get()}/reports/spotbugs/main.xml")
        }
    }
}

// ── SCA digest: unified flat text report from all analysis XML ───────────
tasks.register('scaDigest', Exec) {
    description = 'Produces build/reports/digest.txt; fails the build on checkstyle errors or test failures'
    group = 'verification'
    commandLine 'python3', "${projectDir}/tools/sca-digest.py"
}
tasks.checkstyleMain.finalizedBy(tasks.scaDigest)
tasks.pmdMain.finalizedBy(tasks.scaDigest)
tasks.spotbugsMain.finalizedBy(tasks.scaDigest)
tasks.named('cpd') { finalizedBy tasks.scaDigest }
tasks.named('check') { finalizedBy tasks.scaDigest }

tasks.register('generateTextures', JavaExec) {
    description = 'Regenerates CA fluid textures and blob base sprites'
    group = 'goo'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.mercuriusxeno.goo.tools.FluidTextureGenerator'
    workingDir = project.projectDir
}

tasks.withType(ProcessResources).configureEach {
    var replaceProperties = [
        minecraft_version      : minecraft_version,
        minecraft_version_range: minecraft_version_range,
        neo_version            : neo_version,
        neo_version_range      : neo_version_range,
        loader_version_range   : loader_version_range,
        mod_id                 : mod_id,
        mod_name               : mod_name,
        mod_license            : mod_license,
        mod_version            : mod_version,
        mod_authors            : mod_authors,
        mod_description        : mod_description,
    ]
    inputs.properties replaceProperties
    filesMatching(['META-INF/neoforge.mods.toml']) {
        expand replaceProperties
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    // Treating deprecation warnings as errors, preference.
    options.compilerArgs += ['-Xlint:deprecation', '-Werror']
}

// Runs sca-fix.py JavadocMethod to auto-stub missing @param/@return/@throws,
// then ImportOrder to fix any import reordering the stubs introduced.
// Backfill meaningful descriptions into the stubs manually after this runs.
tasks.register('fixJavadoc', Exec) {
    group = 'verification'
    description = 'Auto-stub missing Javadoc tags via sca-fix.py, then fix import order'
    dependsOn 'checkstyleMain'
    commandLine 'python', 'tools/sca-fix.py', 'JavadocMethod'
    doLast {
        exec { commandLine 'python', 'tools/sca-fix.py', 'ImportOrder' }
    }
}

// NeoGradle run init scripts use Task.project and Gradle.addListener at execution
// time, which are unsupported with the configuration cache in Gradle 9.
tasks.configureEach {
    if (name.contains('net.neoforged.fml.startup')) {
        notCompatibleWithConfigurationCache('NeoGradle run tasks use Task.project at execution time')
    }
}
