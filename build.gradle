plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.gradle.userdev' version '7.1.21'
    id 'jacoco'
    id 'checkstyle'
    id 'pmd'
    id 'com.github.spotbugs' version '6.1.13'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(25)

def buildDir = layout.buildDirectory

// Apply access transformers at compile time so AT-widened members are visible to javac
minecraft.accessTransformers.file rootProject.file('src/main/resources/META-INF/accesstransformer.cfg')

runs {
    configureEach {
        systemProperty 'forge.logging.markers', 'REGISTRIES'
        systemProperty 'forge.logging.console.level', 'debug'
        systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        modSource project.sourceSets.main
    }
    client {
        systemProperty 'devauth.enabled', 'true'
        // 4GB heap + ZGC for low-latency recording sessions
        jvmArguments.addAll '-Xmx4G', '-Xms4G', '-XX:+UseZGC', '-XX:+AlwaysPreTouch'
    }
    gameTestServer {
        // JUnit XML report for sca-digest.py consumption
        arguments.addAll '--report', file("${buildDir.get()}/test-results/gameTest/TEST-gametest.xml").absolutePath
        // JaCoCo agent so gametest coverage merges with unit-test coverage.
        // The jacocoAgent configuration resolves to a wrapper jar; extract jacocoagent.jar from it.
        var wrapperJar = configurations.jacocoAgent.singleFile
        var agentJar = zipTree(wrapperJar).matching { include 'jacocoagent.jar' }.singleFile
        jvmArguments.add("-javaagent:${agentJar}=destfile=${buildDir.get()}/jacoco/gameTest.exec,includes=com.mercuriusxeno.goo.*")
    }
    clientData {
        arguments.addAll '--mod', project.mod_id, '--all',
            '--output', file('src/generated/resources/').absolutePath,
            '--existing', file('src/main/resources/').absolutePath
    }
}

// JUnitLikeTestReporter writes the XML without creating parent dirs first.
// afterEvaluate defers the lookup until NeoGradle has registered runGameTestServer.
afterEvaluate {
    tasks.named('runGameTestServer').configure {
        var reportDir = file("${buildDir.get()}/test-results/gameTest")
        doFirst { reportDir.mkdirs() }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

repositories {
    maven { url = 'https://pkgs.dev.azure.com/djtheredstoner/DevAuth/_packaging/public/maven/v1' }
}

dependencies {
    implementation "net.neoforged:neoforge:${neo_version}"
    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testImplementation 'org.mockito:mockito-core:5.23.0'
    testImplementation 'org.mockito:mockito-junit-jupiter:5.23.0'
    testImplementation 'org.instancio:instancio-junit:5.4.0'
    testImplementation 'com.tngtech.archunit:archunit-junit5:1.4.1'
    localRuntime 'me.djtheredstoner:DevAuth-neoforge:1.2.2'
    spotbugsPlugins 'com.mebigfatguy.sb-contrib:sb-contrib:7.6.8'
    spotbugsPlugins 'com.h3xstream.findsecbugs:findsecbugs-plugin:1.13.0'
}

// -Pverbose to log passed/skipped events alongside failures.
tasks.named('test', Test) {
    useJUnitPlatform()
    testLogging {
        if (project.hasProperty('verbose')) {
            events 'passed', 'failed', 'skipped'
        } else {
            events 'failed'
        }
        showStandardStreams = false
        exceptionFormat = 'full'
        showCauses = true
        showStackTraces = true
    }
    reports {
        html.required = true
        junitXml {
            required = true
            // Capture stdout/stderr per-test in the XML files
            outputPerTestCase = true
        }
    }
}

tasks.register('jacocoGooTestReport', JacocoReport) {
    description = 'Generates JaCoCo coverage report merging unit tests and gametests'
    group = 'verification'
    dependsOn tasks.named('test')
    executionData fileTree(dir: buildDir, includes: ['jacoco/*.exec'])
    sourceSets sourceSets.main
    reports {
        html.required = true
        xml.required = false
        csv.required = true
    }
    // Every 0% class is a MOCK_BLOCK extraction waiting to happen.
}

tasks.register('coverage') {
    description = 'Runs unit tests + gametests, then generates merged JaCoCo report'
    group = 'verification'
    dependsOn 'test', 'runGameTestServer'
    finalizedBy 'jacocoGooTestReport'
}

apply from: 'gradle/sca.gradle'

// SpotBugs lives in the root script because its DSL references plugin classes
// (Effort, Confidence, SpotBugsTask) that resolve only in the parent script's
// classloader. scaDigest wiring is in sca.gradle.
spotbugs {
    ignoreFailures = true
    effort = com.github.spotbugs.snom.Effort.valueOf('MAX')
    reportLevel = com.github.spotbugs.snom.Confidence.valueOf('MEDIUM')
    excludeFilter = file('config/spotbugs/spotbugs-exclude.xml')
    // Override engine to 4.9.8 for ASM 9.9 (JDK 25 / class file version 69)
    toolVersion = '4.9.8'
}

tasks.named('spotbugsTest') { enabled = false }

tasks.withType(com.github.spotbugs.snom.SpotBugsTask).configureEach {
    showProgress = false
    // Suppress "classes needed for analysis were missing" stderr noise
    extraArgs = ['-quiet']
    reports {
        html {
            required = true
            outputLocation = file("${buildDir.get()}/reports/spotbugs/main.html")
        }
        xml {
            required = true
            outputLocation = file("${buildDir.get()}/reports/spotbugs/main.xml")
        }
    }
}

// Gametests boot a full Minecraft server; opt-in via -PgameTests
if (project.hasProperty('gameTests')) {
    tasks.named('check') { dependsOn 'runGameTestServer' }
}

tasks.register('generateTextures', JavaExec) {
    description = 'Regenerates CA fluid textures and blob base sprites'
    group = 'goo'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.mercuriusxeno.goo.tools.FluidTextureGenerator'
    workingDir = project.projectDir
}

tasks.withType(ProcessResources).configureEach {
    var replaceProperties = [
        minecraft_version      : minecraft_version,
        minecraft_version_range: minecraft_version_range,
        neo_version            : neo_version,
        neo_version_range      : neo_version_range,
        loader_version_range   : loader_version_range,
        mod_id                 : mod_id,
        mod_name               : mod_name,
        mod_license            : mod_license,
        mod_version            : mod_version,
        mod_authors            : mod_authors,
        mod_description        : mod_description,
    ]
    inputs.properties replaceProperties
    filesMatching(['META-INF/neoforge.mods.toml']) {
        expand replaceProperties
    }
}

// UTF-8 applies everywhere; deprecation-as-error is scoped to mod sources so
// NeoGradle's transformed-vanilla recompile step stays clean of vanilla's
// own deprecated internals.
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    if (name in ['compileJava', 'compileTestJava']) {
        options.compilerArgs += ['-Xlint:deprecation', '-Werror']
    }
}

// NeoGradle run init scripts use Task.project and Gradle.addListener at execution
// time, which the configuration cache rejects in Gradle 9.
tasks.configureEach {
    if (name.contains('net.neoforged.fml.startup')) {
        notCompatibleWithConfigurationCache('NeoGradle run tasks use Task.project at execution time')
    }
}

apply from: 'gradle/uml.gradle'
